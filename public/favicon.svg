<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="favBg2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0F2856" />
      <stop offset="100%" stop-color="#040A17" />
    </radialGradient>
    <linearGradient id="favNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22FFA1" />
      <stop offset="100%" stop-color="#00BA66" />
    </linearGradient>
    <linearGradient id="favCyan2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60EFFF" />
      <stop offset="100%" stop-color="#0096C7" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="64" height="64" rx="18" fill="url(#favBg2)" stroke="rgba(0, 237, 135, 0.4)" stroke-width="1.5" />

  <!-- Window Header Indicator Dots -->
  <circle cx="16" cy="12" r="1.8" fill="#FF5F56" opacity="0.8" />
  <circle cx="22" cy="12" r="1.8" fill="#FFBD2E" opacity="0.8" />
  <circle cx="28" cy="12" r="1.8" fill="#27C93F" opacity="0.8" />

  <!-- Code Monogram '< M / >' -->
  <!-- Left Bracket -->
  <path d="M22 22 L10 35 L22 48" stroke="url(#favNeon)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Bracket -->
  <path d="M42 22 L54 35 L42 48" stroke="url(#favNeon)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Forward Tech Slash -->
  <path d="M38 18 L26 50" stroke="url(#favCyan2)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Center M Peak & Core Point -->
  <path d="M23 25 L32 37 L41 25" stroke="url(#favNeon)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="32" cy="37" r="2.2" fill="#FFFFFF" />
